<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#091015">
<title>Identi-Siren</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--ink:#eef5f8;--muted:#9fb1ba;--line:#25333c;--accent:#f5b642;--red:#ea5b58;--green:#53c68c}*{box-sizing:border-box}html,body{height:100%;margin:0;background:#091015;color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}header{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 18px;background:#0b1319;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:12px;white-space:nowrap}.mark{width:42px;height:42px;display:grid;place-items:center;border-radius:11px;background:var(--accent);color:#1b160b;font-weight:900;box-shadow:0 0 30px #f5b64235}.brand h1{font-size:20px;margin:0}.brand p{font-size:12px;color:var(--muted);margin:2px 0 0}.tools{display:flex;gap:8px;width:min(72vw,760px)}input{width:100%;padding:11px 13px;border:1px solid #31434e;border-radius:10px;background:#111d24;color:white;outline:none}.tools button,.action{padding:10px 12px;border:1px solid #34505e;border-radius:9px;background:#182832;color:#eaf4f8;cursor:pointer;text-decoration:none}.tools button:hover,.action:hover{background:#213541}main{height:calc(100% - 72px);display:grid;grid-template-columns:minmax(0,1fr) 430px}#map{height:100%;background:#111}#panel{overflow:auto;background:linear-gradient(180deg,#101a21,#0a1116);border-left:1px solid var(--line)}.empty{height:100%;padding:44px;display:flex;flex-direction:column;justify-content:center}.pulse{width:72px;height:72px;border:2px solid var(--accent);border-radius:50%;box-shadow:0 0 0 14px #f5b64212,0 0 0 28px #f5b64208}.empty h2{font-size:28px;margin:20px 0 6px}.empty p,.muted{color:var(--muted);line-height:1.55}.detail{padding:22px}.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:800}.detail h2{font-size:30px;line-height:1.05;margin:8px 0}.place{color:var(--muted);margin-bottom:18px}.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:20px}.chip{font-size:12px;padding:6px 9px;border-radius:999px;background:#17252d;border:1px solid #2b3d47}.card{margin:14px 0;background:#111d24;border:1px solid #263843;border-radius:13px;overflow:hidden}.card h3{font-size:13px;margin:0;padding:12px 14px;border-bottom:1px solid #263843}.body,.loading{padding:14px;color:#d6e1e6;font-size:14px;line-height:1.5}.frame{display:block;width:100%;height:240px;border:0;background:#081015}.video-meta{padding:10px 13px;font-size:12px;color:var(--muted)}.video-meta a{color:#cce7ff}.row{display:flex;gap:8px}.row .action{flex:1;text-align:center}.legend{position:fixed;z-index:1000;left:14px;bottom:18px;display:flex;gap:13px;padding:9px 11px;border:1px solid #2b3b44;border-radius:10px;background:#0b141bd9;backdrop-filter:blur(8px);font-size:11px}.legend span{display:flex;align-items:center;gap:5px}.dot{width:9px;height:9px;border-radius:50%}.active{background:var(--green)}.inactive{background:var(--red)}.unknown{background:var(--accent)}.pin{width:16px;height:16px;border-radius:50%;border:2px solid white;box-shadow:0 2px 8px #0009}@media(max-width:850px){header{align-items:flex-start;flex-wrap:wrap}.tools{width:100%;flex-wrap:wrap}.tools input{min-width:100%}.tools button{flex:1}main{height:calc(100% - 181px);display:block}#map{height:57%}#panel{height:43%;border-left:0;border-top:1px solid var(--line)}.legend{display:none}}
</style>
</head>
<body>
<header><div class="brand"><div class="mark">IS</div><div><h1>Identi-Siren</h1><p>Outdoor warning siren explorer</p></div></div><div class="tools"><input id="search" type="search" placeholder="Search model, town, county, or state"><button id="locate">Locate me</button><button id="keyButton">Video API key</button></div></header>
<main><section id="map" aria-label="Satellite siren map"></section><aside id="panel"><div class="empty"><div class="pulse"></div><h2>Select a siren</h2><p>Click a pin to identify the unit, inspect its testing information, search for a recording, and open Street View.</p><p id="status" class="muted">Loading sirens…</p></div></aside></main>
<div class="legend"><span><i class="dot active"></i>Active</span><span><i class="dot inactive"></i>Inactive</span><span><i class="dot unknown"></i>Unknown</span></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
'use strict';
const SIRENS=[
{id:'demo-1',name:'Chelan 3T22',manufacturer:'Federal Signal',model:'3T22',status:'active',category:'Fire / outdoor warning',city:'Chelan',state:'Washington',lat:47.8405,lng:-120.0163,mount:'Pole mounted',testSchedule:'No regular public testing reported in the source discussion.'},
{id:'demo-2',name:'Manson Model 5',manufacturer:'Federal Signal',model:'Model 5',status:'unknown',category:'Outdoor warning siren',city:'Manson',state:'Washington',lat:47.8848,lng:-120.1596,mount:'Rooftop',testSchedule:'No verified schedule stored.'},
{id:'demo-3',name:'Mount Sterling M-10',manufacturer:'Sterling',model:'M-10 (custom housing)',status:'unknown',category:'Fire siren',city:'Mount Sterling',state:'Illinois',lat:39.9873,lng:-90.7635,mount:'Behind fire station',testSchedule:'No verified schedule stored.'},
{id:'demo-4',name:'Cassville Model 2',manufacturer:'Federal Signal',model:'Model 2',status:'unknown',category:'Outdoor warning siren',city:'Cassville',state:'West Virginia',lat:39.6606,lng:-80.0665,mount:'Pole mounted',testSchedule:'No verified schedule stored.'}
];
const VIDEO_APIS=['https://pipedapi.kavin.rocks','https://pipedapi.adminforge.de','https://api.piped.private.coffee','https://pipedapi.leptons.xyz'];
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const panel=document.querySelector('#panel'),search=document.querySelector('#search');let markers=[];
const map=L.map('map',{zoomControl:false,preferCanvas:true}).setView([39.5,-98.35],4);L.control.zoom({position:'bottomright'}).addTo(map);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Imagery © Esri and contributors'}).addTo(map);
L.tileLayer('https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:''}).addTo(map);
function color(s){return s==='active'?'#53c68c':s==='inactive'?'#ea5b58':'#f5b642'}
function queryFor(s){return [s.name,s.manufacturer,s.model,'siren test',s.city,s.state].filter(Boolean).join(' ')}
function ytSearch(q){return 'https://www.youtube.com/results?search_query='+encodeURIComponent(q)}
function street(s){return `https://www.google.com/maps?layer=c&cbll=${encodeURIComponent(s.lat)},${encodeURIComponent(s.lng)}&cbp=11,0,0,0,0&output=svembed`}
async function json(url,timeout=8000){const c=new AbortController(),t=setTimeout(()=>c.abort(),timeout);try{const r=await fetch(url,{signal:c.signal,headers:{Accept:'application/json'}});if(!r.ok)throw Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(t)}}
function score(v,s){const t=(v.title+' '+(v.uploaderName||'')).toLowerCase();let n=/siren|warning|tornado/.test(t)?3:0;for(const x of [s.name,s.model,s.city,s.state].filter(Boolean).flatMap(x=>x.toLowerCase().split(/[^a-z0-9]+/)).filter(x=>x.length>1))if(t.includes(x))n+=x.length>4?3:1;return n}
function normalize(r){return (r.items||r||[]).map(x=>{const id=(x.url||'').match(/(?:watch\?v=|shorts\/)([\w-]{6,})/)?.[1]||x.id||x.videoId;return{id,title:x.title||'Siren video',uploaderName:x.uploaderName||x.uploader||x.author||'',embed:id?'https://www.youtube-nocookie.com/embed/'+id:'',url:id?'https://www.youtube.com/watch?v='+id:(x.url||'')}}).filter(x=>x.id)}
async function videos(s){const q=queryFor(s),cacheKey='is-video:'+q.toLowerCase();try{const old=JSON.parse(localStorage.getItem(cacheKey)||'null');if(old&&Date.now()-old.at<604800000)return old.value}catch{}
const key=localStorage.getItem('is-youtube-key')||'';if(key){try{const u=new URL('https://www.googleapis.com/youtube/v3/search');u.searchParams.set('part','snippet');u.searchParams.set('type','video');u.searchParams.set('maxResults','6');u.searchParams.set('q',q);u.searchParams.set('key',key);const r=await json(u);const value={source:'YouTube Data API',items:(r.items||[]).map(x=>({id:x.id.videoId,title:x.snippet.title,uploaderName:x.snippet.channelTitle,embed:'https://www.youtube-nocookie.com/embed/'+x.id.videoId,url:'https://www.youtube.com/watch?v='+x.id.videoId}))};localStorage.setItem(cacheKey,JSON.stringify({at:Date.now(),value}));return value}catch{}}
let error;for(const api of VIDEO_APIS){try{const r=normalize(await json(api+'/search?q='+encodeURIComponent(q)+'&filter=videos')).map(v=>({...v,score:score(v,s)})).sort((a,b)=>b.score-a.score).slice(0,6);if(r.length){const value={source:new URL(api).hostname,items:r};localStorage.setItem(cacheKey,JSON.stringify({at:Date.now(),value}));return value}}catch(e){error=e}}throw error||Error('No video provider answered')}
function showVideo(el,r){const v=r.items[0];el.innerHTML=`<iframe class="frame" loading="lazy" allowfullscreen src="${esc(v.embed)}" title="${esc(v.title)}"></iframe><div class="video-meta">${esc(v.title)}${v.uploaderName?' · '+esc(v.uploaderName):''} · <a href="${esc(v.url)}" target="_blank" rel="noopener">open video</a><br>Found via ${esc(r.source)}.</div>`}
async function show(s){map.flyTo([s.lat,s.lng],Math.max(map.getZoom(),16));const q=queryFor(s);panel.innerHTML=`<article class="detail"><div class="eyebrow">${esc(s.status||'unknown')} · ${esc(s.category||'Outdoor warning siren')}</div><h2>${esc(s.name)}</h2><div class="place">${esc([s.city,s.county,s.state].filter(Boolean).join(', '))}</div><div class="chips"><span class="chip">${esc(s.manufacturer||'Unknown maker')}</span><span class="chip">${esc(s.model||'Unknown model')}</span><span class="chip">${esc(s.mount||'Mount unknown')}</span></div><section class="card"><h3>Testing schedule</h3><div class="body">${esc(s.testSchedule||'No verified public test schedule is stored yet.')}</div></section><section class="card"><h3>Automatic video discovery</h3><div id="video" class="loading">Searching public video indexes…</div></section><section class="card"><h3>Street View</h3><iframe class="frame" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="${street(s)}" title="Street View near ${esc(s.name)}"></iframe></section><div class="row"><a class="action" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lng}">Open map</a><a class="action" target="_blank" rel="noopener" href="${ytSearch(q)}">Search YouTube</a></div></article>`;const el=document.querySelector('#video');try{showVideo(el,await videos(s))}catch(e){el.innerHTML=`Automatic search did not answer. <a target="_blank" rel="noopener" href="${ytSearch(q)}">Open YouTube search</a> or add a YouTube API key.<br><small>${esc(e.message)}</small>`}}
function render(items){markers.forEach(m=>m.remove());markers=items.map(s=>{const icon=L.divIcon({className:'',html:`<div class="pin" style="background:${color(s.status)}"></div>`,iconSize:[16,16],iconAnchor:[8,8]});return L.marker([s.lat,s.lng],{icon,title:s.name}).addTo(map).on('click',()=>show(s))})}
search.addEventListener('input',()=>{const q=search.value.toLowerCase().trim();render(!q?SIRENS:SIRENS.filter(s=>JSON.stringify(s).toLowerCase().includes(q)))});
document.querySelector('#locate').onclick=()=>map.locate({setView:true,maxZoom:12});
document.querySelector('#keyButton').onclick=()=>{const old=localStorage.getItem('is-youtube-key')||'';const key=prompt('Optional YouTube Data API key. It will be stored only in this browser:',old);if(key===null)return;if(key.trim())localStorage.setItem('is-youtube-key',key.trim());else localStorage.removeItem('is-youtube-key');alert(key.trim()?'API key saved.':'API key removed.')};
render(SIRENS);document.querySelector('#status').textContent=SIRENS.length+' siren locations loaded.';
</script>
</body>
</html>
