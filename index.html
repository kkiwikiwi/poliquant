<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Identi-Siren</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>:root{--bg:#091015;--panel:#0e171d;--line:#26363f;--ink:#eef5f8;--muted:#9eb0b9;--gold:#f5b642;--green:#53c68c;--red:#ea5b58}*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:14px system-ui,-apple-system,Segoe UI,sans-serif}header{height:68px;display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:#0b1319}.logo{font-weight:900;font-size:20px;white-space:nowrap}.logo b{color:var(--gold)}input,button{font:inherit;border:1px solid #334852;border-radius:9px;background:#132129;color:white;padding:10px 12px}input{flex:1;min-width:120px}button{cursor:pointer}main{height:calc(100% - 68px);display:grid;grid-template-columns:minmax(0,1fr) 420px}#map{height:100%}aside{overflow:auto;border-left:1px solid var(--line);background:linear-gradient(#101a21,#091015)}.empty,.detail{padding:24px}.empty{height:100%;display:flex;flex-direction:column;justify-content:center}.muted{color:var(--muted);line-height:1.5}.eyebrow{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);font-weight:800}.detail h2{font-size:28px;line-height:1.05;margin:8px 0}.chips{display:flex;flex-wrap:wrap;gap:7px;margin:16px 0}.chip{padding:6px 9px;border-radius:999px;background:#16252d;border:1px solid #2c3e47;font-size:12px}.card{margin:14px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#111d24}.card h3{font-size:13px;margin:0;padding:11px 13px;border-bottom:1px solid var(--line)}.body{padding:13px;line-height:1.5}.frame{display:block;width:100%;height:235px;border:0;background:#081015}.actions{display:flex;gap:8px}.actions a{flex:1;text-align:center;text-decoration:none;color:white;border:1px solid #36515e;border-radius:9px;padding:10px;background:#172832}.status{position:fixed;z-index:1000;left:12px;bottom:14px;padding:8px 10px;border:1px solid #30414a;border-radius:9px;background:#0b141bd9;font-size:12px}.pin{border-radius:50%;border:2px solid white;box-shadow:0 1px 6px #000}.warn{color:#ffd47a}.ok{color:#7ee2aa}@media(max-width:850px){header{height:auto;flex-wrap:wrap}.logo{width:100%}main{height:calc(100% - 116px);display:block}#map{height:58%}aside{height:42%;border-left:0;border-top:1px solid var(--line)}.status{display:none}}</style></head><body><header><div class="logo">Identi-<b>Siren</b></div><input id="search" placeholder="Search siren, model, state, or source map"><button id="locate">Locate me</button><button id="key">Video key</button></header><main><div id="map"></div><aside id="panel"><div class="empty"><h1>Select a siren</h1><p class="muted">Pins are imported directly from every public Google My Map linked in the master siren-map thread. Click a pin for the original description, exact coordinates, Street View, and strict video matching.</p><p id="load" class="muted">Loading dataset…</p></div></aside></main><div id="status" class="status">Loading…</div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="data/sirens.js"></script><script>'use strict';const S=Array.isArray(window.IDENTI_SIRENS)?window.IDENTI_SIRENS:[],M=Array.isArray(window.IDENTI_MAP_MANIFEST)?window.IDENTI_MAP_MANIFEST:[],panel=document.querySelector('#panel'),search=document.querySelector('#search'),statusEl=document.querySelector('#status'),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const map=L.map('map',{preferCanvas:true,zoomControl:false}).setView([39.5,-98.35],4);L.control.zoom({position:'bottomright'}).addTo(map);L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Imagery © Esri'}).addTo(map);L.tileLayer('https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxZoom:19}).addTo(map);let layers=[];function color(s){return s==='active'?'#53c68c':s==='inactive'?'#ea5b58':'#f5b642'}function q(s){return [s.name,s.model,s.manufacturer,'siren',s.city,s.state].filter(Boolean).join(' ')}function street(s){return `https://www.google.com/maps?layer=c&cbll=${encodeURIComponent(s.lat)},${encodeURIComponent(s.lng)}&cbp=11,0,0,0,0&output=svembed`}function yt(s){return 'https://www.youtube.com/results?search_query='+encodeURIComponent(q(s))}async function video(s){const key=localStorage.getItem('is-youtube-key');if(!key)throw Error('Automatic embedding is disabled until a YouTube Data API key is supplied.');const u=new URL('https://www.googleapis.com/youtube/v3/search');u.search=new URLSearchParams({part:'snippet',type:'video',maxResults:'10',q:q(s),key});const r=await fetch(u);if(!r.ok)throw Error('YouTube search failed.');const j=await r.json(),models=String(s.model||s.name).toLowerCase().split(/[^a-z0-9]+/).filter(x=>x.length>1),places=[s.city,s.state,s.sourceMap].filter(Boolean).flatMap(x=>String(x).toLowerCase().split(/[^a-z0-9]+/)).filter(x=>x.length>2);const items=(j.items||[]).map(x=>{const h=(x.snippet.title+' '+x.snippet.channelTitle).toLowerCase(),mh=models.filter(t=>h.includes(t)).length,ph=places.filter(t=>h.includes(t)).length;return{x,mh,ph,score:mh*6+ph*5}}).filter(v=>v.mh>0&&v.ph>0).sort((a,b)=>b.score-a.score);if(!items.length)throw Error('No video matched both the mapped model and locality.');return items[0].x}async function show(s){map.flyTo([s.lat,s.lng],Math.max(map.getZoom(),16));panel.innerHTML=`<article class="detail"><div class="eyebrow">${esc(s.status||'unknown')} · ${esc(s.category||'warning siren')}</div><h2>${esc(s.name)}</h2><div class="muted">${esc([s.city,s.state].filter(Boolean).join(', ')||s.sourceMap||'Location from source map')}</div><div class="chips"><span class="chip">${esc(s.manufacturer||'Maker not listed')}</span><span class="chip">${esc(s.model||'Model not listed')}</span><span class="chip">${Number(s.lat).toFixed(6)}, ${Number(s.lng).toFixed(6)}</span></div><section class="card"><h3>Original map information</h3><div class="body">${esc(s.description||'No description was supplied by the map owner.')}${s.sourceUrl?`<br><br><a target="_blank" rel="noopener" href="${esc(s.sourceUrl)}">Open source map</a>`:''}</div></section><section class="card"><h3>Testing schedule</h3><div class="body">${esc(s.testSchedule||'No verified testing schedule was present in the source pin.')}</div></section><section class="card"><h3>Video</h3><div id="video" class="body">Checking for an exact model-and-location match…</div></section><section class="card"><h3>Street View at the pin coordinates</h3><iframe class="frame" loading="lazy" src="${street(s)}"></iframe></section><div class="actions"><a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lng}">Open coordinates</a><a target="_blank" rel="noopener" href="${yt(s)}">Search YouTube</a></div></article>`;const box=document.querySelector('#video');try{const v=await video(s),id=v.id.videoId;box.outerHTML=`<iframe class="frame" loading="lazy" src="https://www.youtube-nocookie.com/embed/${esc(id)}" title="${esc(v.snippet.title)}" allowfullscreen></iframe><div class="body ok">Exact-match candidate: ${esc(v.snippet.title)}</div>`}catch(e){box.innerHTML=`<span class="warn">No video was embedded because Identi-Siren will not guess.</span><br>${esc(e.message)}<br><br><a target="_blank" rel="noopener" href="${yt(s)}">Review the precise YouTube search</a>`}}function render(list){layers.forEach(x=>x.remove());layers=list.map(s=>L.circleMarker([s.lat,s.lng],{renderer:L.canvas(),radius:5,weight:1.5,color:'#fff',fillColor:color(s.status),fillOpacity:.95}).addTo(map).bindTooltip(s.name).on('click',()=>show(s)))}render(S);search.addEventListener('input',()=>{const x=search.value.toLowerCase().trim();render(!x?S:S.filter(s=>JSON.stringify(s).toLowerCase().includes(x)))});document.querySelector('#locate').onclick=()=>map.locate({setView:true,maxZoom:12});document.querySelector('#key').onclick=()=>{const old=localStorage.getItem('is-youtube-key')||'',v=prompt('Optional YouTube Data API key. It is stored only in this browser. Leave blank to remove it.',old);if(v===null)return;v.trim()?localStorage.setItem('is-youtube-key',v.trim()):localStorage.removeItem('is-youtube-key')};const good=M.filter(x=>x.status==='ok').length,failed=M.filter(x=>x.status==='failed').length;document.querySelector('#load').textContent=S.length?`${S.length.toLocaleString()} sirens loaded from ${good.toLocaleString()} maps.`:'The automated import has not produced data yet.';statusEl.textContent=`${S.length.toLocaleString()} pins · ${good} maps loaded${failed?` · ${failed} failed`:''}`;</script></body></html>
